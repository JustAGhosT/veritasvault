name: Build and Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar needs full history to attribute "new code" to the right commits.
          # A shallow clone silently degrades new-code detection, which is what the
          # diff-coverage gate is measured against.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # SonarScanner for .NET runs on the JVM.
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Sonar analysis is skipped entirely when SONAR_TOKEN is absent, so this
      # workflow stays green on forks and before the secret is provisioned.
      # It activates automatically once the token is added — no workflow edit needed.
      - name: Check for SonarCloud token
        id: sonar_check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "SonarCloud analysis: ENABLED"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SONAR_TOKEN is not set - skipping SonarCloud analysis and the diff-coverage gate."
          fi

      - name: Install SonarScanner
        if: steps.sonar_check.outputs.enabled == 'true'
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore dependencies
        run: dotnet restore

      # SonarScanner for .NET hooks MSBuild, so `begin` must precede the build and
      # `end` must follow the tests. It does NOT read sonar-project.properties —
      # analysis parameters have to be passed here as /d: arguments.
      #
      # Project key/org default to the current repo slug but are overridable via
      # repository variables (Settings > Secrets and variables > Actions > Variables),
      # because a SonarCloud key is fixed at import time and does NOT follow a repo
      # rename. This repo was renamed vv -> veritasvault, so if the Sonar project was
      # imported before the rename its key is still `JustAGhosT_vv`. Check the project's
      # Information page and set SONAR_PROJECT_KEY if the default is wrong.
      - name: SonarCloud begin
        if: steps.sonar_check.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"${{ vars.SONAR_PROJECT_KEY || 'JustAGhosT_veritasvault' }}" \
            /o:"${{ vars.SONAR_ORGANIZATION || 'justaghost' }}" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="**/TestResults/*.trx" \
            /d:sonar.coverage.exclusions="tests/**,**/Program.cs,**/Startup.cs,**/Migrations/**" \
            /d:sonar.qualitygate.wait=true

      - name: Build
        run: dotnet build --no-restore

      - name: Test with coverage
        run: |
          dotnet test --no-build --verbosity normal \
            --settings tests/vv.Infrastructure.Tests/coverage.runsettings \
            --logger "trx;LogFileName=test-results.trx"

      # `end` uploads analysis + coverage and, because qualitygate.wait is set above,
      # blocks until SonarCloud returns a verdict and fails the job if the gate fails.
      - name: SonarCloud end
        if: steps.sonar_check.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate HTML coverage report
        run: |
          reportgenerator \
          "-reports:tests/**/TestResults/**/coverage.cobertura.xml" \
          "-targetdir:coverage-report" \
          "-reporttypes:Html;Cobertura"

      - name: Check code coverage threshold
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage-report/Cobertura.xml
          # Absolute-coverage regression guard. Without fail_below_min this step
          # only reports and can never fail the build.
          # Measured on the first run with corrected collection: 20% line
          # (266/1300), 16% branch (73/457). The previously documented 11.5%
          # UNDERSTATED coverage — only vv.Infrastructure.Tests was instrumented,
          # so both numerator and denominator were a partial slice.
          # 18 sits just under the measured value as a regression guard. Raise it
          # toward the 35% Phase 1 target as tests land.
          fail_below_min: true
          thresholds: "18 60"
          badge: true
          format: markdown
          output: both

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report
          if-no-files-found: error

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md
